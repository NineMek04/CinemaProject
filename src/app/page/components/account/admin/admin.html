@defer {
@if (config(); as appConfig) {
<div class="admin-dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="logo-box">
                <i [class]="'dx-icon-' + appConfig.brand.icon"></i>
            </div>
            <div class="brand-text">
                <h1>{{appConfig.brand.name}}</h1>
                <span class="editorial-label">EDITORIAL ADMIN</span>
            </div>
        </div>

        <nav class="nav-links">
            @for (item of adminNavItems; track item.route) {
            <a [routerLink]="item.route" 
               routerLinkActive="active" 
               class="nav-item">
                <i [class]="'dx-icon-' + item.icon"></i> {{item.label}}
            </a>
            }
        </nav>

        <div class="sidebar-footer">
            <dx-button 
                icon="plus" 
                text="New Release" 
                stylingMode="contained" 
                class="new-release-btn">
            </dx-button>

            <div class="license-card">
                <p>Subscription Level</p>
                <div class="level-badge">
                    <span>Enterprise</span>
                    <span class="pro-tag">Pro</span>
                </div>
                <dx-button text="Manage Licenses" stylingMode="text" class="manage-btn"></dx-button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="content-area">
        <!-- Top Header -->
        <header class="top-nav">
            <div class="search-box">
                <dx-text-box placeholder="Search films, users, or metadata..." mode="search" stylingMode="filled">
                    <dxi-button name="search" location="before"
                        [options]="{ icon: 'search', stylingMode: 'text' }"></dxi-button>
                </dx-text-box>
            </div>

            <div class="top-actions">
                <dx-button icon="bell" stylingMode="text"></dx-button>
                <dx-button icon="preferences" stylingMode="text"></dx-button>
                <div class="admin-profile">
                    <div class="profile-text">
                        <span class="name">{{appConfig.currentUser.name}}</span>
                        <span class="role">{{appConfig.currentUser.role}}</span>
                    </div>
                    <img [src]="appConfig.currentUser.avatarPath" alt="Admin Avatar" class="profile-img">
                </div>
            </div>
        </header>

        <!-- Sub-component Viewport -->
        <router-outlet></router-outlet>
    </main>
</div>
}
}
@placeholder {
<div class="p-20 text-center animate-pulse text-slate-500">
    Initializing Editorial Core...
</div>
}
