@defer {
<dx-drawer [opened]="isDrawerOpen" openedStateMode="shrink" position="left" revealMode="expand" template="menuTemplate">

    <div *dxTemplate="let data of 'menuTemplate'" class="drawer-menu-container">
        <!-- Back Button Section -->
        <div class="sidebar-header">
            <dx-button 
                icon="arrowleft" 
                stylingMode="text" 
                class="back-btn"
                (onClick)="goBack()">
            </dx-button>
        </div>

        <!-- Profile Section -->
        <div class="profile-header">
            <div class="avatar-container">
                <img src="assets/avatar.png" alt="User Avatar" class="profile-avatar">
            </div>
            <div class="profile-info">
                <h1 class="profile-name">{{currentUser.name}}</h1>
                <p class="profile-status">{{currentUser.class}}</p>
            </div>
        </div>

        <!-- Navigation Menu -->
        <dx-list [dataSource]="navigationItems" [hoverStateEnabled]="true" [activeStateEnabled]="true"
            [focusStateEnabled]="false" class="panel-list" [selectedItemKeys]="[selectedItemId]" keyExpr="id"
            selectionMode="single" (onItemClick)="onItemClick($event)">
            <div *dxTemplate="let item of 'item'">
                <div class="menu-item" [class.active]="item.id === selectedItemId">
                    <i [class]="'dx-icon-' + item.icon"></i>
                    <span>{{ item.text }}</span>
                </div>
            </div>
        </dx-list>
    </div>

    <div id="content" class="main-content">
        <app-users></app-users>
    </div>

</dx-drawer>
}
@placeholder {
<div>กำลังโหลดตารางข้อมูล...</div>
}
