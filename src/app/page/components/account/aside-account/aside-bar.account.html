@defer {
<dx-drawer [opened]="isDrawerOpen()" openedStateMode="shrink" position="left" revealMode="expand"
    template="menuTemplate">

    <div *dxTemplate="let data of 'menuTemplate'" class="drawer-menu-container">
        <!-- Profile Section -->
        <div class="profile-header">
            <h1 class="text-2xl font-bold mb-1">Account Settings</h1>
        </div>

        <!-- Navigation Menu -->
        <dx-list [dataSource]="navigationItems" [hoverStateEnabled]="true" [activeStateEnabled]="true"
            [focusStateEnabled]="false" class="panel-list" [selectedItemKeys]="[selectedItemId()]" keyExpr="id"
            selectionMode="single" (onItemClick)="onItemClick($event)">
            <div *dxTemplate="let item of 'item'">
                <div class="menu-item" [class.active]="item.id === selectedItemId()">
                    <i [class]="'dx-icon-' + item.icon"></i>
                    <span>{{ item.text }}</span>
                </div>
            </div>
        </dx-list>
    </div>

    <div id="content" class="main-content">
        div <app-users [currentUser]="currentUser()"></app-users>
    </div>

</dx-drawer>
}
@placeholder {
<div class="p-8 text-slate-500 font-medium animate-pulse">
    Loading settings...
</div>
}
