<div class=" bg-[#0a0a0c] flex items-center justify-center p-4 font-sans text-slate-300">
  <div
    class="w-full max-w-md bg-[#111216] p-8 md:p-10 rounded-2xl shadow-2xl border border-slate-800/60 relative overflow-hidden">

    <div class="text-center mb-8">
      <h1 class="text-4xl font-black italic uppercase tracking-tight text-white mb-2">Join The Elite</h1>
      <p class="text-sm text-slate-400">Stream the extraordinary. Cancel anytime.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmitRegister()" class="space-y-5">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">First Name</label>
        <input type="text" formControlName="firstName" placeholder="Enter your first name"
          class="w-full bg-[#1a1c23] text-white text-sm px-4 py-3 rounded-lg outline-none focus:ring-1 focus:ring-[#ff6b6b] transition-all placeholder-slate-600">
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Last Name</label>
        <input type="text" formControlName="lastName" placeholder="Enter your last name"
          class="w-full bg-[#1a1c23] text-white text-sm px-4 py-3 rounded-lg outline-none focus:ring-1 focus:ring-[#ff6b6b] transition-all placeholder-slate-600">
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Email Address</label>
        <input type="email" formControlName="email" placeholder="you@example.com"
          class="w-full bg-[#1a1c23] text-white text-sm px-4 py-3 rounded-lg outline-none focus:ring-1 focus:ring-[#ff6b6b] transition-all placeholder-slate-600">
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Secure Password</label>
        <input type="password" formControlName="password" placeholder="Min. 8 characters"
          class="w-full bg-[#1a1c23] text-white text-sm px-4 py-3 rounded-lg outline-none focus:ring-1 focus:ring-[#ff6b6b] transition-all placeholder-slate-600">
      </div>

      <div class="pt-4">
        <button type="submit"
          class="w-full flex justify-center items-center gap-2 bg-[#ff6b6b] hover:bg-[#ff5252] text-slate-900 text-sm font-bold uppercase tracking-widest py-3.5 rounded-lg transition-all shadow-[0_0_20px_rgba(255,107,107,0.25)] hover:shadow-[0_0_25px_rgba(255,107,107,0.4)]">
          Join Now
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>
      </div>
    </form>

    <div class="mt-8 mb-10 text-center text-xs text-slate-500">
      Already have an account?
      <a (click)="onGoToLogin($event)"
        class="text-white font-bold hover:text-[#ff6b6b] transition-colors cursor-pointer">Sign in</a>
    </div>

    <div class="border-t border-slate-800/80 pt-6 flex justify-between text-center px-4">
      <div class="flex flex-col items-center">
        <svg class="w-5 h-5 text-[#ff6b6b] mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
          </path>
        </svg>
        <span class="text-[8px] font-bold uppercase tracking-widest text-slate-400">4K UHD</span>
      </div>
      <div class="flex flex-col items-center">
        <svg class="w-5 h-5 text-[#ff6b6b] mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        <span class="text-[8px] font-bold uppercase tracking-widest text-slate-400">Offline</span>
      </div>
      <div class="flex flex-col items-center">
        <svg class="w-5 h-5 text-[#ff6b6b] mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
        <span class="text-[8px] font-bold uppercase tracking-widest text-slate-400">Multi-Dev</span>
      </div>
    </div>

  </div>
</div>
